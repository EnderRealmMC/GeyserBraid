name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Set this secret in the repo settings to enable Modrinth publishing;
      # without it, the Modrinth step below skips itself
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Semver prerelease marker: a hyphen suffix (e.g. v0.1.0-rc.1)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "versionType=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "versionType=release" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: ./gradlew build --no-daemon -PbuildVersion=${{ steps.meta.outputs.version }}
      - name: Extract changelog for the tag
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag = 1; next}
            flag && $0 ~ "^## \\[" {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_BODY.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/GeyserBraid-*.jar
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          JAR="$(ls build/libs/GeyserBraid-*.jar)"
          # The draft project is invisible without the token; fetch its real id
          PROJECT_ID="$(curl -sS -H "Authorization: ${{ env.MODRINTH_TOKEN }}" \
            https://api.modrinth.com/v2/project/geyserbraid | jq -r .id)"
          # Modrinth requires at least one game version; take the range Geyser
          # itself declares so the list follows Geyser's support automatically
          GAME_VERSIONS="$(curl -sS https://api.modrinth.com/v2/project/geyser/version | jq -c '.[0].game_versions')"
          if [ -z "$GAME_VERSIONS" ] || [ "$GAME_VERSIONS" = "null" ]; then
            GAME_VERSIONS='["1.21"]'
          fi
          # jq -Rs turns the changelog into a JSON string
          cat > modrinth-version.json <<EOF
          {
            "name": "GeyserBraid ${VERSION}",
            "version_number": "${VERSION}",
            "changelog": $(jq -Rs . < RELEASE_BODY.md),
            "game_versions": ${GAME_VERSIONS},
            "version_type": "${{ steps.meta.outputs.versionType }}",
            "loaders": ["geyser"],
            "featured": false,
            "dependencies": [],
            "file_parts": ["file[0]"],
            "project_id": "${PROJECT_ID}"
          }
          EOF
          curl --fail-with-body -sS -H "Authorization: ${{ env.MODRINTH_TOKEN }}" \
            -F "data=@modrinth-version.json;type=application/json" \
            -F "file[0]=@${JAR}" \
            https://api.modrinth.com/v2/version
