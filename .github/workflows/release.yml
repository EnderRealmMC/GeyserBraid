name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Set this secret in the repo settings to enable Modrinth publishing;
      # without it, the Modrinth step below skips itself
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      # Optional override: space-separated game versions. Left empty, the list
      # is inferred from the Modrinth dependency on Geyser (see mc-publish step)
      MODRINTH_GAME_VERSIONS: ${{ vars.MODRINTH_GAME_VERSIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Semver prerelease marker: a hyphen suffix (e.g. v0.1.0-rc.1)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: ./gradlew build --no-daemon -PbuildVersion=${{ steps.meta.outputs.version }}
      - name: Extract changelog for the tag
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag = 1; next}
            flag && $0 ~ "^## \\[" {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_BODY.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/GeyserBraid-*.jar
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: geyserbraid
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: build/libs/GeyserBraid-*.jar
          name: GeyserBraid ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          # -rc/-beta suffixes map to beta, -alpha to alpha, clean versions to release
          version-type: ${{ steps.meta.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog-file: RELEASE_BODY.md
          loaders: geyser
          # game-versions follows Geyser itself via this dependency; the
          # MODRINTH_GAME_VERSIONS variable overrides it when set
          dependencies: |
            modrinth:geyser:required
          game-versions: ${{ env.MODRINTH_GAME_VERSIONS }}
